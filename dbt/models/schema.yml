version: 2
models:
  - name: stg_pos_transactions
    description: One row per POS line item, typed, with net revenue after discount.
    columns:
      - name: txn_id
        tests: [unique, not_null]
      - name: store_id
        tests:
          - not_null
          - relationships:
              arguments: {to: ref('stg_stores'), field: store_id}
      - name: category
        tests:
          - accepted_values:
              arguments:
                values: ['iPhone', 'Mac', 'iPad', 'Watch', 'AirPods', 'Accessories']
  - name: stg_carrier_activations
    description: One row per carrier activation reported by the carrier partner.
    columns:
      - name: activation_id
        tests: [unique, not_null]
  - name: dim_store
    columns:
      - name: store_id
        tests: [unique, not_null]
  - name: fct_daily_store_sales
    description: Daily sales per store.
    tests:
      - unique_combination:
          arguments:
            columns: ['txn_date', 'store_id']
  - name: fct_activation_reconciliation
    description: POS iPhone sales vs carrier activations, on dates where both systems loaded.
    columns:
      - name: recon_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['matched', 'missing_activation', 'orphan_activation', 'store_mismatch']
  - name: store_tiering
    description: Weighted multi-factor score and tier per store.
    columns:
      - name: store_id
        tests: [unique, not_null]
      - name: tier
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Platinum', 'Gold', 'Silver', 'Bronze']
