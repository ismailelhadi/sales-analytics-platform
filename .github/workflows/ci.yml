name: ci
on: [push, pull_request]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sales
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: sales
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q tests/test_quality.py tests/test_rag_unit.py
      - name: End-to-end run (generate, load, dbt build, index, evaluate, integration tests)
        run: ./run_all.sh
      - uses: actions/upload-artifact@v4
        with: {name: results, path: results/}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sales-analytics-platform .
